<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Myanmar Movie Recap AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101010;
            color: white;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: auto;
            padding: 25px 18px;
        }

        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 30px;
        }

        .card {
            background: #1b1b1b;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 18px;
        }

        input[type="file"] {
            width: 100%;
            padding: 15px;
            background: #292929;
            color: white;
            border-radius: 12px;
            border: 1px solid #444;
        }

        button {
            width: 100%;
            margin-top: 18px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #6c4cff;
            color: white;
            font-size: 17px;
            font-weight: bold;
        }

        button:disabled {
            background: #444;
        }

        .status {
            margin-top: 18px;
            padding: 14px;
            border-radius: 10px;
            background: #252525;
            color: #ccc;
            display: none;
        }

        .result {
            display: none;
        }

        textarea {
            width: 100%;
            min-height: 280px;
            resize: vertical;
            background: #101010;
            color: white;
            border: 1px solid #444;
            border-radius: 12px;
            padding: 15px;
            font-size: 15px;
            line-height: 1.6;
        }

        .info {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 12px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎬 Myanmar Movie Recap AI</h1>

    <div class="subtitle">
        နိုင်ငံခြား Recap Video ကို မြန်မာ Recap အဖြစ်ပြောင်းရန်
    </div>


    <div class="card">

        <div class="info">
            ပထမဆုံး စမ်းသပ်ရန် ၁ မိနစ်ဝန်းကျင် Video အသုံးပြုပါ။
        </div>

        <input
            type="file"
            id="videoFile"
            accept="video/*"
        >

        <button
            id="generateBtn"
            onclick="generateTranscript()"
        >
            🎙️ Transcript ထုတ်မယ်
        </button>

        <div
            class="status"
            id="status"
        ></div>

    </div>


    <div
        class="card result"
        id="result"
    >

        <h3>📝 Transcript</h3>

        <div
            class="info"
            id="videoInfo"
        ></div>

        <textarea
            id="transcript"
            readonly
        ></textarea>

    </div>

</div>


<script>

async function generateTranscript() {

    const fileInput =
        document.getElementById("videoFile");

    const button =
        document.getElementById("generateBtn");

    const status =
        document.getElementById("status");

    const result =
        document.getElementById("result");

    const transcript =
        document.getElementById("transcript");

    const videoInfo =
        document.getElementById("videoInfo");


    if (!fileInput.files.length) {

        alert("Video တစ်ပုဒ်ရွေးပါ။");

        return;
    }


    const file =
        fileInput.files[0];


    const formData =
        new FormData();

    formData.append(
        "file",
        file
    );


    button.disabled = true;

    button.innerText =
        "⏳ Processing...";


    status.style.display =
        "block";

    status.innerText =
        "Video ကို upload လုပ်နေပါတယ်...";


    result.style.display =
        "none";


    try {

        status.innerText =
            "🎙️ Free Whisper နဲ့ အသံကို စာပြောင်းနေပါတယ်...";


        const response =
            await fetch(
                "/transcribe",
                {
                    method: "POST",
                    body: formData
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.detail ||
                "Transcription failed"
            );
        }


        transcript.value =
            data.text || "";


        videoInfo.innerText =
            "Language: " +
            data.language +
            " | Duration: " +
            data.duration +
            " seconds";


        result.style.display =
            "block";


        status.innerText =
            "✅ Transcript ပြီးပါပြီ။";


    } catch (error) {

        status.innerText =
            "❌ Error: " +
            error.message;

    }


    button.disabled =
        false;

    button.innerText =
        "🎙️ Transcript ထုတ်မယ်";
}

</script>

</body>
</html>
