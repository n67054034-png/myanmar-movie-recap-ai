<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Myanmar Movie Recap AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                "Noto Sans Myanmar",
                "Myanmar Text",
                Arial,
                sans-serif;
            background: #111;
            color: white;
        }

        .container {
            max-width: 800px;
            margin: auto;
            padding: 25px 18px 60px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #aaa;
            line-height: 1.8;
            margin-bottom: 25px;
        }

        .card {
            background: #1d1d1d;
            border-radius: 18px;
            padding: 22px;
            margin-bottom: 20px;
        }

        input[type="file"] {
            width: 100%;
            padding: 15px;
            background: #292929;
            color: white;
            border-radius: 10px;
            border: 1px solid #444;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: #6c4cff;
            color: white;
            font-size: 18px;
            font-weight: bold;
        }

        button:disabled {
            opacity: 0.5;
        }

        .status {
            margin-top: 15px;
            color: #aaa;
            line-height: 1.8;
        }

        .box {
            background: #111;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 18px;
            white-space: pre-wrap;
            line-height: 1.9;
            max-height: 450px;
            overflow-y: auto;
        }

        .hidden {
            display: none;
        }

        .success {
            color: #48e08b;
        }

        .error {
            color: #ff6464;
        }

        .voice-title {
            margin-top: 25px;
            margin-bottom: 12px;
        }

        .voice-option {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #292929;
            border: 1px solid #444;
            border-radius: 12px;
            padding: 15px;
            margin-top: 10px;
            cursor: pointer;
        }

        .voice-option input {
            width: 20px;
            height: 20px;
        }

        .voice-name {
            font-size: 17px;
        }

        .voice-description {
            color: #999;
            font-size: 13px;
            margin-top: 3px;
        }

        .download-btn {
            background: #333;
        }

        audio {
            width: 100%;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎬 Myanmar Movie Recap AI</h1>

    <div class="subtitle">
        Video တင်ပြီး မြန်မာ Movie Recap ပြောင်းပါ။
        ပြီးရင် ကိုယ်ကြိုက်တဲ့ မြန်မာအသံနဲ့ MP3 နဲ့ SRT ထုတ်နိုင်ပါတယ်။
    </div>


    <!-- ========================= -->
    <!-- VIDEO -->
    <!-- ========================= -->

    <div class="card">

        <h2>🎬 Video ရွေးပါ</h2>

        <input
            type="file"
            id="videoFile"
            accept="video/*"
        >

        <button
            id="startButton"
        >
            🚀 Recap စတင်မယ်
        </button>

        <div
            id="status"
            class="status"
        >
            Video ရွေးပြီး Recap စတင်မယ်ကို နှိပ်ပါ။
        </div>

    </div>


    <!-- ========================= -->
    <!-- TRANSCRIPT -->
    <!-- ========================= -->

    <div
        id="transcriptCard"
        class="card hidden"
    >

        <h2>📝 Transcript</h2>

        <div
            id="transcript"
            class="box"
        ></div>

    </div>


    <!-- ========================= -->
    <!-- RECAP -->
    <!-- ========================= -->

    <div
        id="recapCard"
        class="card hidden"
    >

        <h2>🎙️ မြန်မာ Movie Recap</h2>

        <div
            id="recap"
            class="box"
        ></div>


        <!-- ========================= -->
        <!-- VOICE -->
        <!-- ========================= -->

        <h2 class="voice-title">
            🔊 အသံရွေးပါ
        </h2>


        <label class="voice-option">

            <input
                type="radio"
                name="voice"
                value="thiha"
                checked
            >

            <div>

                <div class="voice-name">
                    👨 Male — Thiha
                </div>

                <div class="voice-description">
                    မြန်မာ အမျိုးသားအသံ
                </div>

            </div>

        </label>


        <label class="voice-option">

            <input
                type="radio"
                name="voice"
                value="nilar"
            >

            <div>

                <div class="voice-name">
                    👩 Female — Nilar
                </div>

                <div class="voice-description">
                    မြန်မာ အမျိုးသမီးအသံ
                </div>

            </div>

        </label>

<h2 class="voice-title">
    ⚡ အသံ Speed
</h2>

<select id="speedSelect"
    style="
        width:100%;
        padding:16px;
        background:#292929;
        color:white;
        border:1px solid #444;
        border-radius:12px;
        font-size:17px;
    ">

    <option value="0.8">🐢 0.8× — နှေး</option>

    <option value="0.9">🔉 0.9× — နည်းနည်းနှေး</option>

    <option value="1.0" selected>
        ▶️ 1.0× — ပုံမှန်
    </option>

    <option value="1.1">🔊 1.1× — နည်းနည်းမြန်</option>

    <option value="1.2">🚀 1.2× — မြန်</option>

    <option value="1.3">🚀 1.3× — ပိုမြန်</option>

</select>
        <button
            id="ttsButton"
        >
            🔊 ရွေးထားတဲ့အသံနဲ့ အသံထုတ်မယ်
        </button>


        <div
            id="ttsStatus"
            class="status"
        ></div>


        <!-- AUDIO PLAYER -->

        <audio
            id="audioPlayer"
            controls
            class="hidden"
        ></audio>


        <!-- DOWNLOAD MP3 -->

        <button
            id="downloadAudioButton"
            class="download-btn hidden"
        >
            🎵 MP3 ရယူမယ်
        </button>


        <!-- DOWNLOAD SRT -->

        <button
            id="downloadSrtButton"
            class="download-btn hidden"
        >
            📄 SRT ရယူမယ်
        </button>
<!-- CREATE FINAL VIDEO -->

<button
    id="createVideoButton"
    class="download-btn"
>
    🎬 AI Recap Video ထုတ်မယ်
</button>

<div
    id="videoStatus"
    class="status"
></div>

        <button
            id="copyButton"
            class="download-btn"
        >
            📋 Recap Copy
        </button>

    </div>

</div>


<script>

const startButton =
    document.getElementById(
        "startButton"
    );

const ttsButton =
    document.getElementById(
        "ttsButton"
    );

const copyButton =
    document.getElementById(
        "copyButton"
    );


let audioBlob = null;
let srtText = "";


/* =================================
   START RECAP
================================= */

startButton.addEventListener(
    "click",
    startProcess
);


async function startProcess() {

    const fileInput =
        document.getElementById(
            "videoFile"
        );

    const status =
        document.getElementById(
            "status"
        );

    const transcriptCard =
        document.getElementById(
            "transcriptCard"
        );

    const recapCard =
        document.getElementById(
            "recapCard"
        );

    const transcriptBox =
        document.getElementById(
            "transcript"
        );

    const recapBox =
        document.getElementById(
            "recap"
        );


    if (!fileInput.files.length) {

        status.innerHTML =
            "❌ Video တစ်ခုရွေးပေးပါ။";

        status.className =
            "status error";

        return;
    }


    const file =
        fileInput.files[0];


    startButton.disabled = true;

    transcriptCard.classList.add(
        "hidden"
    );

    recapCard.classList.add(
        "hidden"
    );


    try {

        /* =========================
           STEP 1
        ========================= */

        status.innerHTML =
            "🎙️ Video ကို အသံစာသားပြောင်းနေပါတယ်...";

        status.className =
            "status";


        const formData =
            new FormData();

        formData.append(
            "file",
            file
        );


        const transcribeResponse =
            await fetch(
                "/transcribe",
                {
                    method: "POST",
                    body: formData
                }
            );


        const transcribeData =
            await transcribeResponse.json();


        if (!transcribeResponse.ok) {

            throw new Error(
                transcribeData.detail ||
                "Transcript မအောင်မြင်ပါ"
            );
        }


        transcriptBox.textContent =
            transcribeData.text || "";


        transcriptCard.classList.remove(
            "hidden"
        );


        /* =========================
           STEP 2
        ========================= */

        status.innerHTML =
            "🤖 AI က မြန်မာ Movie Recap ရေးနေပါတယ်...";


        const recapResponse =
            await fetch(
                "/recap",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        text:
                            transcribeData.text
                    })
                }
            );


        const recapData =
            await recapResponse.json();


        if (!recapResponse.ok) {

            throw new Error(
                recapData.detail ||
                "Recap မအောင်မြင်ပါ"
            );
        }


        recapBox.textContent =
            recapData.recap || "";


        recapCard.classList.remove(
            "hidden"
        );


        status.innerHTML =
            "✅ Transcript + မြန်မာ Recap ပြီးပါပြီ။";

        status.className =
            "status success";


    } catch (error) {

        console.error(error);

        status.innerHTML =
            "❌ " + error.message;

        status.className =
            "status error";

    } finally {

        startButton.disabled =
            false;
    }
}


/* =================================
   TTS
================================= */

ttsButton.addEventListener(
    "click",
    createTTS
);


async function createTTS() {

    const recap =
        document.getElementById(
            "recap"
        ).textContent.trim();


    const ttsStatus =
        document.getElementById(
            "ttsStatus"
        );


    const audioPlayer =
        document.getElementById(
            "audioPlayer"
        );


    const downloadAudioButton =
        document.getElementById(
            "downloadAudioButton"
        );


    const downloadSrtButton =
        document.getElementById(
            "downloadSrtButton"
        );


    if (!recap) {

        ttsStatus.innerHTML =
            "❌ Recap စာမရှိသေးပါ။";

        ttsStatus.className =
            "status error";

        return;
    }


    const selectedVoice =
        document.querySelector(
            'input[name="voice"]:checked'
        ).value;

const selectedSpeed =
    parseFloat(
        document.getElementById(
            "speedSelect"
        ).value
    );
    
    ttsButton.disabled = true;


    ttsStatus.innerHTML =
        "🔊 အသံထုတ်နေပါတယ်... ခဏစောင့်ပါ။";

    ttsStatus.className =
        "status";


    audioPlayer.classList.add(
        "hidden"
    );

    downloadAudioButton.classList.add(
        "hidden"
    );

    downloadSrtButton.classList.add(
        "hidden"
    );


    try {

        const response =
            await fetch(
                "/tts",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

    text: recap,

    voice:
        selectedVoice,

    speed:
        selectedSpeed

})
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.detail ||
                "TTS မအောင်မြင်ပါ"
            );
        }


        /*
         * Backend က MP3 ကို hex
         * အနေနဲ့ ပြန်ပေးထားတာကို
         * browser Blob ပြန်လုပ်ခြင်း
         */

        const hex =
            data.audio;


        const bytes =
            new Uint8Array(
                hex.length / 2
            );


        for (
            let i = 0;
            i < hex.length;
            i += 2
        ) {

            bytes[i / 2] =
                parseInt(
                    hex.substring(
                        i,
                        i + 2
                    ),
                    16
                );
        }


        audioBlob =
            new Blob(
                [bytes],
                {
                    type:
                        "audio/mpeg"
                }
            );


        const audioURL =
            URL.createObjectURL(
                audioBlob
            );


        audioPlayer.src =
            audioURL;


        audioPlayer.classList.remove(
            "hidden"
        );


        /* =========================
           MP3 DOWNLOAD
        ========================= */

        downloadAudioButton.classList.remove(
            "hidden"
        );


        downloadAudioButton.onclick =
            function () {

                const link =
                    document.createElement(
                        "a"
                    );

                link.href =
                    audioURL;

                link.download =
                    "myanmar-recap-" +
                    selectedVoice +
                    ".mp3";

                link.click();
            };


        /* =========================
           SRT
        ========================= */

        srtText =
            data.srt || "";


        downloadSrtButton.classList.remove(
            "hidden"
        );


        downloadSrtButton.onclick =
            function () {

                const blob =
                    new Blob(
                        [srtText],
                        {
                            type:
                                "text/plain;charset=utf-8"
                        }
                    );


                const url =
                    URL.createObjectURL(
                        blob
                    );


                const link =
                    document.createElement(
                        "a"
                    );

                link.href =
                    url;

                link.download =
                    "myanmar-recap-" +
                    selectedVoice +
                    ".srt";

                link.click();


                URL.revokeObjectURL(
                    url
                );
            };


        ttsStatus.innerHTML =
            "✅ " +
            (
                selectedVoice ===
                "thiha"
                    ? "Thiha"
                    : "Nilar"
            ) +
            " အသံနဲ့ MP3 + SRT ပြီးပါပြီ။";

        ttsStatus.className =
            "status success";


    } catch (error) {

        console.error(error);

        ttsStatus.innerHTML =
            "❌ " +
            error.message;

        ttsStatus.className =
            "status error";

    } finally {

        ttsButton.disabled =
            false;
    }
}


/* =================================
   COPY
================================= */

copyButton.addEventListener(
    "click",
    async function () {

        const recap =
            document.getElementById(
                "recap"
            ).textContent;


        try {

            await navigator.clipboard
                .writeText(
                    recap
                );

            alert(
                "Recap ကို Copy လုပ်ပြီးပါပြီ။"
            );

        } catch {

            alert(
                "စာကို ဖိပြီး Copy လုပ်ပါ။"
            );
        }
    }
);

</script>

</body>
</html>
