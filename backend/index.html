<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Myanmar Movie Recap AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        .container {
            max-width: 800px;
            margin: auto;
            padding: 25px 18px 50px;
        }

        h1 {
            font-size: 34px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 25px;
        }

        .card {
            background: #1d1d1d;
            border-radius: 18px;
            padding: 22px;
            margin-bottom: 20px;
        }

        input[type="file"] {
            width: 100%;
            padding: 15px;
            background: #292929;
            color: white;
            border-radius: 10px;
            border: 1px solid #444;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: #6c4cff;
            color: white;
            font-size: 18px;
            font-weight: bold;
        }

        button:disabled {
            opacity: 0.5;
        }

        .download {
            display: block;
            width: 100%;
            margin-top: 15px;
            padding: 16px;
            border-radius: 12px;
            background: #168f5b;
            color: white;
            text-align: center;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
        }

        .status {
            margin-top: 15px;
            color: #aaa;
        }

        .box {
            background: #111;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 18px;
            white-space: pre-wrap;
            line-height: 1.8;
            max-height: 450px;
            overflow-y: auto;
        }

        .hidden {
            display: none;
        }

        .success {
            color: #48e08b;
        }

        .error {
            color: #ff6464;
        }

        audio {
            width: 100%;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Myanmar Movie Recap AI</h1>

    <div class="subtitle">
        Video တင်ပြီး မြန်မာ Movie Recap အလိုအလျောက်ထုတ်ပါ
    </div>

    <div class="card">

        <h2>🎬 Video ရွေးပါ</h2>

        <input
            type="file"
            id="videoFile"
            accept="video/*"
        >

        <button
            id="startButton"
            onclick="startProcess()"
        >
            🚀 Recap စတင်မယ်
        </button>

        <div
            id="status"
            class="status"
        >
            Video ရွေးပြီး Recap စတင်မယ်ကို နှိပ်ပါ။
        </div>

    </div>


    <div
        id="transcriptCard"
        class="card hidden"
    >

        <h2>📝 Transcript</h2>

        <div
            id="transcript"
            class="box"
        ></div>

    </div>


    <div
        id="recapCard"
        class="card hidden"
    >

        <h2>🎙️ မြန်မာ Movie Recap</h2>

        <div
            id="recap"
            class="box"
        ></div>

        <button
            onclick="copyRecap()"
        >
            📋 Recap Copy
        </button>

    </div>


    <div
        id="ttsCard"
        class="card hidden"
    >

        <h2>🔊 မြန်မာ AI အသံ</h2>

        <div class="status">
            မြန်မာ Recap ကို AI အသံအဖြစ် ပြောင်းပြီးပါပြီ။
        </div>

        <audio
            id="audioPlayer"
            controls
        ></audio>

        <a
            id="downloadAudio"
            class="download"
            download="myanmar-recap.mp3"
        >
            ⬇️ MP3 Download
        </a>

    </div>

</div>


<script>

async function startProcess() {

    const fileInput =
        document.getElementById("videoFile");

    const button =
        document.getElementById("startButton");

    const status =
        document.getElementById("status");

    const transcriptCard =
        document.getElementById("transcriptCard");

    const recapCard =
        document.getElementById("recapCard");

    const ttsCard =
        document.getElementById("ttsCard");

    const transcriptBox =
        document.getElementById("transcript");

    const recapBox =
        document.getElementById("recap");

    const audioPlayer =
        document.getElementById("audioPlayer");

    const downloadAudio =
        document.getElementById("downloadAudio");


    if (!fileInput.files.length) {

        status.innerHTML =
            "❌ Video တစ်ခုရွေးပေးပါ။";

        status.className =
            "status error";

        return;
    }


    const file =
        fileInput.files[0];


    button.disabled = true;

    transcriptCard.classList.add("hidden");
    recapCard.classList.add("hidden");
    ttsCard.classList.add("hidden");


    try {

        // =========================
        // STEP 1 — TRANSCRIBE
        // =========================

        status.innerHTML =
            "🎙️ Video ကို Transcript ပြောင်းနေပါတယ်...";

        status.className =
            "status";


        const formData =
            new FormData();

        formData.append(
            "file",
            file
        );


        const transcribeResponse =
            await fetch(
                "/transcribe",
                {
                    method: "POST",
                    body: formData
                }
            );


        const transcribeData =
            await transcribeResponse.json();


        if (!transcribeResponse.ok) {

            throw new Error(
                transcribeData.detail ||
                "Transcript မအောင်မြင်ပါ"
            );
        }


        const transcript =
            transcribeData.text || "";


        transcriptBox.textContent =
            transcript;


        transcriptCard.classList.remove(
            "hidden"
        );


        // =========================
        // STEP 2 — RECAP
        // =========================

        status.innerHTML =
            "🤖 AI က မြန်မာ Movie Recap ရေးနေပါတယ်...";


        const recapResponse =
            await fetch(
                "/recap",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        text: transcript
                    })
                }
            );


        const recapData =
            await recapResponse.json();


        if (!recapResponse.ok) {

            throw new Error(
                recapData.detail ||
                "Recap မအောင်မြင်ပါ"
            );
        }


        const recapText =
            recapData.recap || "";


        recapBox.textContent =
            recapText;


        recapCard.classList.remove(
            "hidden"
        );


        // =========================
        // STEP 3 — TTS
        // =========================

        status.innerHTML =
            "🔊 မြန်မာ AI အသံထုတ်နေပါတယ်...";


        const ttsResponse =
            await fetch(
                "/tts",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        text: recapText
                    })
                }
            );


        if (!ttsResponse.ok) {

            let errorMessage =
                "TTS မအောင်မြင်ပါ";

            try {

                const errorData =
                    await ttsResponse.json();

                errorMessage =
                    errorData.detail ||
                    errorMessage;

            } catch {

            }

            throw new Error(
                errorMessage
            );
        }


        const audioBlob =
            await ttsResponse.blob();


        const audioUrl =
            URL.createObjectURL(
                audioBlob
            );


        audioPlayer.src =
            audioUrl;


        downloadAudio.href =
            audioUrl;


        ttsCard.classList.remove(
            "hidden"
        );


        status.innerHTML =
            "✅ Transcript + Recap + မြန်မာ AI အသံ အောင်မြင်ပါပြီ။";

        status.className =
            "status success";


    } catch (error) {

        console.error(error);

        status.innerHTML =
            "❌ " + error.message;

        status.className =
            "status error";

    } finally {

        button.disabled = false;

    }

}


async function copyRecap() {

    const recap =
        document.getElementById(
            "recap"
        ).textContent;


    try {

        await navigator.clipboard.writeText(
            recap
        );

        alert(
            "Recap ကို Copy လုပ်ပြီးပါပြီ။"
        );

    } catch {

        alert(
            "Copy မလုပ်နိုင်ပါ။ စာကို ဖိပြီး Copy လုပ်ပါ။"
        );

    }

}

</script>

</body>
</html>
